name: Springville source audit

on:
  push:
    branches: [utah-springville-source-audit]
    paths: [.github/workflows/springville-source-audit.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Springville development layer
        run: |
          curl -fsSL "https://maps.springville.org/server/rest/services/New_Development_Points/FeatureServer/0?f=pjson" | head -c 20000
          echo
          curl -fsSLG "https://maps.springville.org/server/rest/services/New_Development_Points/FeatureServer/0/query" --data-urlencode "where=1=1" --data-urlencode "outFields=*" --data-urlencode "returnGeometry=false" --data-urlencode "resultRecordCount=50" --data-urlencode "f=pjson" | head -c 30000
          echo
          curl -fsSL "https://maps.springville.org/server/rest/services/New_Residential_Subdivisions_Polygons/FeatureServer/0?f=pjson" | head -c 16000
