name: Utah County source audit

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/utah-county-source-audit.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5
      - name: Inspect Utah County building permit source
        shell: python
        run: |
          from collections import Counter
          from datetime import datetime, timezone
          import requests

          URL='https://maps200.utahcounty.gov/arcgis/rest/services/Assessor/Building_Permits/MapServer/1/query'
          fields=['PERMITNO','LOCALPERMITNO','PERMITSOURCE','PERMITTYPE','PERMITCLASSIFICATION','PERMITDATE','PERMITAMOUNT','PERMITREASON','PERMITREASONDETAIL','PERMITUSE','JURISDICTIONID','PERMITSTATUS','OWNERNAME','ACCOUNTNO','CERTIFICATEOFOCCUPANCYDATE']
          r=requests.get(URL,params={
              'where':'1=1','outFields':','.join(fields),'returnGeometry':'false',
              'orderByFields':'PERMITDATE DESC','resultRecordCount':5000,'f':'json'
          },headers={'User-Agent':'UtahConstructionIntelligence/0.5 public-source-audit'},timeout=45)
          print('status',r.status_code,'url',r.url)
          r.raise_for_status(); payload=r.json()
          if 'error' in payload: raise RuntimeError(payload['error'])
          rows=[f.get('attributes',{}) for f in payload.get('features',[])]
          print('count',len(rows),'exceeded',payload.get('exceededTransferLimit'))
          def iso(ms):
              return datetime.fromtimestamp(ms/1000,tz=timezone.utc).date().isoformat() if ms else None
          dates=[iso(x.get('PERMITDATE')) for x in rows if x.get('PERMITDATE')]
          print('date_range',max(dates) if dates else None,min(dates) if dates else None)
          for field in ['PERMITSOURCE','PERMITTYPE','PERMITCLASSIFICATION','PERMITUSE','PERMITSTATUS','JURISDICTIONID']:
              c=Counter(str(x.get(field) or '').strip() for x in rows)
              print('\n',field)
              for k,v in c.most_common(40): print(v,repr(k))
          print('\nRECENT SAMPLES')
          for x in rows[:60]:
              print({k:(iso(x[k]) if k in {'PERMITDATE','CERTIFICATEOFOCCUPANCYDATE'} else x.get(k)) for k in fields})
