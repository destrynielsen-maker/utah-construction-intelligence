name: Orem active-projects source audit

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/orem_active_projects_probe.py'
      - '.github/workflows/orem-source-audit.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.3
      - name: Probe Orem weekly active-projects sheet
        run: python scripts/orem_active_projects_probe.py
